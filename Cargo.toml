[package]
name = "emperor-folder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server confined to one folder: list, read, search, write, move and stat files, never outside the root"
license = "MIT OR Apache-2.0"
authors = ["yarenty <yarenty@gmail.com>"]
repository = "https://github.com/yarenty/emperor-folder"
homepage = "https://github.com/yarenty/emperor-folder"
documentation = "https://docs.rs/emperor-folder"
readme = "README.md"
keywords = ["mcp", "mcp-server", "filesystem", "sandbox", "llm"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "emperor_folder"
path = "src/lib.rs"

[[bin]]
name = "emperor-folder"
path = "src/main.rs"

[dependencies]
emperor-mcp = "0.2"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }

# Confinement, walking, matching
cap-std = "4"
ignore = "0.4"
globset = "0.4"
regex = "1"

clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
